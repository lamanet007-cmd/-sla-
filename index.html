<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster High – Čísla pro Lili!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Short+Stack&display=swap');

    :root {
      --pink: #ff007f;
      --bright-pink: #ff66c4;
      --dark-pink: #99004d;
      --purple: #8a2be2;
      --dark-purple: #240038;
      --black: #0d0d0d;
      --turquoise: #00f5d4;
      --yellow: #ffee00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Short Stack', cursive, sans-serif;
      background-color: var(--black);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(138, 43, 226, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.25) 0%, transparent 40%),
        radial-gradient(circle, #1a0026 12%, transparent 13%);
      background-size: 100% 100%, 100% 100%, 30px 30px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header & Fullscreen */
    header {
      width: 100%;
      background: linear-gradient(90deg, #1a0026, var(--dark-pink), var(--purple), #1a0026);
      border-bottom: 4px solid var(--pink);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(255, 0, 127, 0.6);
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .skull-icon {
      font-size: 32px;
      filter: drop-shadow(0 0 8px var(--bright-pink));
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15) rotate(5deg); }
    }

    h1 {
      margin: 0;
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      color: #fff;
      text-shadow: 0 0 10px var(--pink), 3px 3px 0px #000;
      letter-spacing: 1px;
    }

    .fs-btn {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      border: 2px solid #fff;
      border-radius: 25px;
      padding: 10px 18px;
      font-family: 'Fredoka One', cursive;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
      transition: all 0.2s;
    }

    .fs-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px var(--bright-pink);
    }

    /* Navigation & Score */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95%;
      max-width: 950px;
      margin: 15px 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: rgba(36, 0, 56, 0.9);
      border: 2px solid var(--purple);
      color: #fff;
      padding: 8px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      font-size: 13px;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .mode-btn.active, .mode-btn:hover {
      background: linear-gradient(135deg, var(--pink), var(--dark-pink));
      border-color: #fff;
      box-shadow: 0 0 15px var(--pink);
      transform: translateY(-2px);
    }

    .shop-btn-nav {
      background: linear-gradient(135deg, var(--yellow), #ff9900) !important;
      color: #000 !important;
      border-color: #fff !important;
    }

    .score-board {
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.4), rgba(255, 0, 127, 0.4));
      border: 2px solid var(--bright-pink);
      padding: 6px 18px;
      border-radius: 25px;
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
    }

    /* Main Card */
    .game-card {
      background: linear-gradient(180deg, rgba(30, 5, 45, 0.95), rgba(15, 2, 25, 0.98));
      border: 4px solid var(--pink);
      border-radius: 30px;
      width: 95%;
      max-width: 950px;
      min-height: 520px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5), inset 0 0 15px rgba(138, 43, 226, 0.5);
      position: relative;
      margin-bottom: 25px;
    }

    .instruction-box {
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--purple));
      border: 2px solid #fff;
      padding: 12px 28px;
      border-radius: 25px;
      font-family: 'Fredoka One', cursive;
      font-size: 20px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s;
    }

    .instruction-box:hover {
      transform: scale(1.03);
    }

    /* Common Grids */
    .items-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 160px;
      max-width: 700px;
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px dashed var(--purple);
      border-radius: 20px;
      width: 100%;
    }

    .monster-item {
      font-size: 48px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
      animation: float 3s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .monster-item:hover {
      transform: scale(1.3) rotate(12deg);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .options-grid {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .num-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--purple), #3b004f);
      border: 3px solid var(--bright-pink);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 34px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .num-btn:hover {
      transform: scale(1.18) rotate(-5deg);
      background: var(--pink);
      box-shadow: 0 0 25px var(--pink);
    }

    /* Learn Grid */
    .learn-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 750px;
    }

    .learn-card {
      width: 120px;
      height: 130px;
      background: rgba(36, 0, 56, 0.8);
      border: 3px solid var(--purple);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s;
    }

    .learn-card:hover {
      border-color: var(--pink);
      transform: scale(1.1);
      box-shadow: 0 0 20px var(--pink);
      background: rgba(255, 0, 127, 0.2);
    }

    .learn-card .num {
      font-family: 'Fredoka One', cursive;
      font-size: 42px;
      color: var(--turquoise);
      text-shadow: 0 0 10px var(--turquoise);
    }

    .learn-card .icons {
      font-size: 18px;
      margin-top: 5px;
      word-break: break-all;
      text-align: center;
    }

    /* Compare Mode Interactive Boxes */
    .compare-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .compare-side {
      background: rgba(0,0,0,0.6);
      border: 4px solid var(--purple);
      border-radius: 25px;
      padding: 20px;
      flex: 1;
      min-width: 220px;
      max-width: 320px;
      min-height: 180px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 38px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }

    .compare-side:hover {
      border-color: var(--pink);
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--pink);
      background: rgba(255, 0, 127, 0.15);
    }

    .equal-btn {
      background: linear-gradient(135deg, var(--purple), var(--dark-purple));
      border: 3px solid var(--turquoise);
      color: var(--turquoise);
      padding: 15px 22px;
      border-radius: 20px;
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .equal-btn:hover {
      transform: scale(1.1);
      background: var(--turquoise);
      color: var(--black);
      box-shadow: 0 0 20px var(--turquoise);
    }

    /* Pexeso Grid */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 550px;
      width: 100%;
    }

    .memory-card {
      height: 95px;
      background: linear-gradient(135deg, var(--purple), var(--dark-purple));
      border: 3px solid var(--bright-pink);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      font-size: 32px;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .memory-card.flipped {
      background: #fff;
      color: var(--black);
      border-color: var(--turquoise);
      transform: rotateY(180deg);
    }

    .memory-card.matched {
      background: rgba(0, 245, 212, 0.3);
      border-color: var(--turquoise);
      cursor: default;
      opacity: 0.8;
    }

    /* Shop Grid */
    .shop-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      max-width: 850px;
      max-height: 420px;
      overflow-y: auto;
      padding: 5px;
    }

    .shop-item {
      background: rgba(36, 0, 56, 0.85);
      border: 3px solid var(--purple);
      border-radius: 22px;
      padding: 12px;
      width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .shop-item:hover {
      border-color: var(--yellow);
      transform: translateY(-3px);
    }

    .shop-item .preview-box {
      width: 60px;
      height: 60px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shop-item .name { font-family: 'Fredoka One', cursive; font-size: 13px; text-align: center; }
    .shop-item .price { color: var(--yellow); font-family: 'Fredoka One', cursive; font-size: 16px; }

    .buy-btn {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: 2px solid #fff;
      color: #fff;
      padding: 6px 14px;
      border-radius: 15px;
      font-family: 'Fredoka One', cursive;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .buy-btn:disabled {
      background: #444;
      border-color: #666;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .buy-btn.equipped {
      background: var(--turquoise);
      color: var(--black);
    }

    /* Cat Mascot in bottom-right corner */
    .cat-container {
      position: fixed;
      bottom: -240px;
      right: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 10000;
      pointer-events: none;
      transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cat-container.active {
      bottom: 15px;
    }

    .cat-avatar-box {
      position: relative;
      width: 110px;
      height: 110px;
      animation: catDance 0.6s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 15px var(--pink));
    }

    @keyframes catDance {
      0% { transform: translateY(0) rotate(-6deg) scale(1); }
      100% { transform: translateY(-18px) rotate(6deg) scale(1.08); }
    }

    .cat-speech {
      background: #fff;
      color: var(--black);
      font-family: 'Fredoka One', cursive;
      font-size: 19px;
      padding: 10px 18px;
      border-radius: 20px;
      border: 3px solid var(--pink);
      box-shadow: 0 0 15px var(--bright-pink);
      margin-bottom: 8px;
      position: relative;
      white-space: nowrap;
    }

    .cat-speech::after {
      content: '';
      position: absolute;
      bottom: -10px;
      right: 35px;
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }

    /* Mode 5: Connect Dots Canvas */
    .canvas-container {
      position: relative;
      width: 500px;
      height: 350px;
      background: rgba(0,0,0,0.6);
      border: 3px dashed var(--pink);
      border-radius: 20px;
      box-shadow: inset 0 0 20px rgba(255,0,127,0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 20px;
    }

    @media (max-width: 700px) {
      h1 { font-size: 18px; }
      .instruction-box { font-size: 16px; padding: 10px 15px; }
      .num-btn { width: 55px; height: 55px; font-size: 24px; }
      .canvas-container { width: 320px; height: 260px; }
      .learn-card { width: 90px; height: 100px; }
      .learn-card .num { font-size: 30px; }
      .compare-side { min-width: 140px; min-height: 120px; font-size: 28px; }
      .equal-btn { padding: 10px 14px; font-size: 16px; }
      .memory-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .memory-card { height: 70px; font-size: 24px; }
      .cat-speech { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <span class="skull-icon">💀🎀</span>
      <h1>Monster High Čísla pro Lili 💖</h1>
    </div>
    <button class="fs-btn" onclick="toggleFullScreen()">Full Screen ⛶</button>
  </header>

  <div class="top-bar">
    <div class="nav-btns">
      <button class="mode-btn active" onclick="switchMode(1)">Nauka Čísel</button>
      <button class="mode-btn" onclick="switchMode(2)">Spočítej</button>
      <button class="mode-btn" onclick="switchMode(3)">Porovnávač</button>
      <button class="mode-btn" onclick="switchMode(4)">Sčítání</button>
      <button class="mode-btn" onclick="switchMode(5)">Spojovačka</button>
      <button class="mode-btn" onclick="switchMode(6)">Poslechni & Najdi</button>
      <button class="mode-btn" onclick="switchMode(7)">Pexeso</button>
      <button class="mode-btn shop-btn-nav" onclick="switchMode(8)">🛒 Obchůdek</button>
    </div>
    <div class="score-board">
      <span>Trofeje Lili:</span>
      <span id="score-count" style="color: var(--yellow);">0</span>
      <span>🏆</span>
    </div>
  </div>

  <div class="game-card">
    <div class="instruction-box" id="instruction" onclick="repeatInstruction()">
      <span id="speaker-icon">🔊</span>
      <span id="instruction-text">Ahoj Lili! Vítá tě Monster High. Vyber si hru!</span>
    </div>

    <!-- Mode 1: Nauka Čísel -->
    <div id="mode-1" class="game-mode-container" style="display: flex; flex-direction: column; align-items: center; width:100%;">
      <div class="learn-container" id="learn-grid"></div>
    </div>

    <!-- Mode 2: Spočítej předměty -->
    <div id="mode-2" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="items-grid" id="items-container"></div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- Mode 3: Porovnávač -->
    <div id="mode-3" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="compare-box">
        <div class="compare-side" id="compare-left" onclick="checkCompare('left')"></div>
        <button class="equal-btn" onclick="checkCompare('equal')">
          <span style="font-size: 32px;">=</span>
          <span>STEJNĚ</span>
        </button>
        <div class="compare-side" id="compare-right" onclick="checkCompare('right')"></div>
      </div>
    </div>

    <!-- Mode 4: Sčítání -->
    <div id="mode-4" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
        <div class="compare-side" id="add-left" style="cursor: default;"></div>
        <div style="font-size: 45px; color: var(--turquoise); font-family: 'Fredoka One';">+</div>
        <div class="compare-side" id="add-right" style="cursor: default;"></div>
      </div>
      <div class="options-grid" id="add-options"></div>
    </div>

    <!-- Mode 5: Spojovačka -->
    <div id="mode-5" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="canvas-container">
        <canvas id="connect-canvas" width="500" height="350"></canvas>
      </div>
    </div>

    <!-- Mode 6: Poslechni a Najdi -->
    <div id="mode-6" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="options-grid" id="listen-options" style="margin-top: 20px;"></div>
    </div>

    <!-- Mode 7: Pexeso -->
    <div id="mode-7" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="memory-grid" id="memory-board"></div>
    </div>

    <!-- Mode 8: Obchůdek s odměnami -->
    <div id="mode-8" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="shop-grid" id="shop-items-container"></div>
    </div>
  </div>

  <!-- Animated Cat Celebration Overlay with SVG custom outfits -->
  <div class="cat-container" id="cat-mascot">
    <div class="cat-speech" id="cat-text">Mňau! Skvěle, Lili! 💖</div>
    <div class="cat-avatar-box" id="cat-rendered-avatar"></div>
  </div>

  <script>
    // Audio Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWinSound() {
      playTone(523.25, 'triangle', 0.1);
      setTimeout(() => playTone(659.25, 'triangle', 0.1), 90);
      setTimeout(() => playTone(783.99, 'triangle', 0.12), 180);
      setTimeout(() => playTone(1046.50, 'triangle', 0.25), 270);
    }

    function playErrorSound() {
      playTone(220, 'sawtooth', 0.2);
      setTimeout(() => playTone(160, 'sawtooth', 0.25), 150);
    }

    // Czech Speech
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'cs-CZ';
        msg.rate = 0.88;
        msg.pitch = 1.2;
        window.speechSynthesis.speak(msg);
      }
    }

    // Game Variables
    let currentMode = 1;
    let score = 0;
    let currentAnswer = null;
    let lastText = "";

    const monsterItems = ['🦇', '🎀', '🧪', '🕷️', '💄', '🔮', '⚡', '👑', '💀', '🌙'];
    const catPraise = [
      'Mňau! Výborně, Lili!',
      'Kočička Crescent má z Lili radost!',
      'Mňau! Lili, jsi šikovná!',
      'Úžasná práce, Lili! 💖',
      'Lili, to bylo super!'
    ];

    const numberNames = ['Jeden', 'Dva', 'Tři', 'Čtyři', 'Pět', 'Šest', 'Sedm', 'Osm', 'Devět', 'Deset'];

    // Custom SVG-based Cat Costumes
    const shopItems = [
      { id: 'bow', name: 'Růžová mašle', price: 0, bought: true, svg: `<path d="M55 25 Q35 15 30 35 Q45 45 55 25 Z" fill="#ff007f"/><path d="M55 25 Q75 15 80 35 Q65 45 55 25 Z" fill="#ff007f"/><circle cx="55" cy="30" r="6" fill="#ffee00"/>` },
      { id: 'ears', name: 'Strašidelné uši', price: 2, bought: false, svg: `<polygon points="25,35 10,5 40,25" fill="#ff007f"/><polygon points="85,35 100,5 70,25" fill="#ff007f"/>` },
      { id: 'collar', name: 'Obojek s lebkou', price: 4, bought: false, svg: `<path d="M35 72 Q55 82 75 72 L73 85 Q55 92 37 85 Z" fill="#111"/><circle cx="55" cy="80" r="7" fill="#fff"/><text x="51" y="84" font-size="9">💀</text>` },
      { id: 'vampire', name: 'Upíří pláštěk', price: 6, bought: false, svg: `<path d="M30 65 L15 105 L55 95 L95 105 L80 65 Z" fill="#99004d"/><path d="M35 65 L55 75 L75 65 Z" fill="#fff"/>` },
      { id: 'lightning', name: 'Bleskové uši', price: 8, bought: false, svg: `<polygon points="35,30 20,2 45,20 30,2" fill="#ffee00"/><polygon points="75,30 90,2 65,20 80,2" fill="#ffee00"/>` },
      { id: 'crown', name: 'Kočičí korunka', price: 12, bought: false, svg: `<polygon points="35,28 42,10 50,22 55,8 60,22 68,10 75,28" fill="#ffee00"/>` },
      { id: 'wings', name: 'Netopýří křídla', price: 20, bought: false, svg: `<path d="M32 60 Q10 40 5 65 Q18 75 32 70 Z" fill="#240038"/><path d="M78 60 Q100 40 105 65 Q92 75 78 70 Z" fill="#240038"/>` }
    ];

    let equippedIndex = 0;

    function getCatSvgMarkup(accessorySvg) {
      return `
        <svg viewBox="0 0 110 110" width="100%" height="100%">
          <!-- Base Cat Head & Body -->
          <ellipse cx="55" cy="70" rx="30" ry="25" fill="#111" />
          <polygon points="32,52 20,20 48,42" fill="#111" />
          <polygon points="78,52 90,20 62,42" fill="#111" />
          <polygon points="34,50 25,26 44,40" fill="#ff66c4" />
          <polygon points="76,50 85,26 66,40" fill="#ff66c4" />
          <!-- Eyes -->
          <ellipse cx="43" cy="65" rx="6" ry="8" fill="#00f5d4" />
          <ellipse cx="67" cy="65" rx="6" ry="8" fill="#00f5d4" />
          <ellipse cx="43" cy="65" rx="2.5" ry="5" fill="#000" />
          <ellipse cx="67" cy="65" rx="2.5" ry="5" fill="#000" />
          <!-- Nose & Whiskers -->
          <polygon points="55,73 52,69 58,69" fill="#ff66c4" />
          <line x1="48" y1="73" x2="30" y2="70" stroke="#fff" stroke-width="1.5" />
          <line x1="48" y1="76" x2="30" y2="77" stroke="#fff" stroke-width="1.5" />
          <line x1="62" y1="73" x2="80" y2="70" stroke="#fff" stroke-width="1.5" />
          <line x1="62" y1="76" x2="80" y2="77" stroke="#fff" stroke-width="1.5" />
          <!-- Mouth -->
          <path d="M52 77 Q55 81 58 77" fill="none" stroke="#fff" stroke-width="1.5" />
          <!-- Accessory / Outfit -->
          ${accessorySvg}
        </svg>
      `;
    }

    function updateCatAvatarDisplay() {
      const avatarBox = document.getElementById('cat-rendered-avatar');
      avatarBox.innerHTML = getCatSvgMarkup(shopItems[equippedIndex].svg);
    }

    document.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });

    function setInstruction(text) {
      lastText = text;
      document.getElementById('instruction-text').innerText = text;
      speak(text);
    }

    function repeatInstruction() {
      if (lastText) speak(lastText);
    }

    function updateScore(points) {
      score += points;
      document.getElementById('score-count').innerText = score;
    }

    function triggerCatCelebration() {
      playWinSound();
      const cat = document.getElementById('cat-mascot');
      const catText = document.getElementById('cat-text');
      
      const randomText = catPraise[Math.floor(Math.random() * catPraise.length)];
      catText.innerText = randomText;
      speak(randomText);

      cat.classList.add('active');
      setTimeout(() => {
        cat.classList.remove('active');
      }, 2200);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
      });

      for (let i = 1; i <= 8; i++) {
        document.getElementById(`mode-${i}`).style.display = i === mode ? 'flex' : 'none';
      }

      if (mode === 1) initMode1();
      if (mode === 2) initMode2();
      if (mode === 3) initMode3();
      if (mode === 4) initMode4();
      if (mode === 5) initMode5();
      if (mode === 6) initMode6();
      if (mode === 7) initMode7();
      if (mode === 8) initMode8();
    }

    // --- MODE 1: Nauka Čísel ---
    function initMode1() {
      setInstruction("Lili, klikni na číslice a nauč se, jak vypadají a jak se čtou!");
      const grid = document.getElementById('learn-grid');
      grid.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const card = document.createElement('div');
        card.className = 'learn-card';
        const icon = monsterItems[(i - 1) % monsterItems.length];
        
        card.innerHTML = `
          <div class="num">${i}</div>
          <div class="icons">${icon.repeat(Math.min(i, 4))}${i > 4 ? '...' : ''}</div>
        `;

        card.onclick = () => {
          playTone(400 + (i * 40), 'sine', 0.2);
          speak(`${i}. ${numberNames[i-1]}. ${i} ${icon}`);
        };

        grid.appendChild(card);
      }
    }

    // --- MODE 2: Spočítej věci ---
    function initMode2() {
      const container = document.getElementById('items-container');
      const options = document.getElementById('options-container');
      container.innerHTML = '';
      options.innerHTML = '';

      const count = Math.floor(Math.random() * 10) + 1;
      currentAnswer = count;
      const itemIcon = monsterItems[Math.floor(Math.random() * monsterItems.length)];

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'monster-item';
        el.innerText = itemIcon;
        el.onclick = () => playTone(350 + (i * 40), 'sine', 0.1);
        container.appendChild(el);
      }

      setInstruction(`Lili, spočítej obrázky a klikni na správné číslo!`);

      let choices = [count];
      while (choices.length < 4) {
        let rnd = Math.floor(Math.random() * 10) + 1;
        if (!choices.includes(rnd)) choices.push(rnd);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = num;
        btn.onclick = () => {
          if (num === currentAnswer) {
            updateScore(1);
            triggerCatCelebration();
            setTimeout(initMode2, 2300);
          } else {
            playErrorSound();
            speak("Lili, zkus to ještě jednou!");
          }
        };
        options.appendChild(btn);
      });
    }

    // --- MODE 3: Porovnávání ---
    let leftVal = 0, rightVal = 0;

    function initMode3() {
      setInstruction("Lili, klikni na skupinku, kde je VÍCE věcí! Nebo na rovnítko uprostřed, pokud je jich stejně.");
      const leftEl = document.getElementById('compare-left');
      const rightEl = document.getElementById('compare-right');

      leftEl.innerHTML = '';
      rightEl.innerHTML = '';

      leftVal = Math.floor(Math.random() * 6) + 1;
      rightVal = Math.floor(Math.random() * 6) + 1;

      const icon1 = monsterItems[Math.floor(Math.random() * monsterItems.length)];
      const icon2 = monsterItems[Math.floor(Math.random() * monsterItems.length)];

      leftEl.innerText = icon1.repeat(leftVal);
      rightEl.innerText = icon2.repeat(rightVal);
    }

    function checkCompare(choice) {
      let isCorrect = false;

      if (choice === 'left' && leftVal > rightVal) isCorrect = true;
      if (choice === 'right' && rightVal > leftVal) isCorrect = true;
      if (choice === 'equal' && leftVal === rightVal) isCorrect = true;

      if (isCorrect) {
        updateScore(1);
        triggerCatCelebration();
        setTimeout(initMode3, 2300);
      } else {
        playErrorSound();
        if (leftVal === rightVal) {
          speak("Lili, tady je jich stejně! Klikni na rovnítko uprostřed.");
        } else {
          speak("Zkus to porovnat ještě jednou, Lili. Kde je víc obrázků?");
        }
      }
    }

    // --- MODE 4: Sčítání ---
    function initMode4() {
      const leftEl = document.getElementById('add-left');
      const rightEl = document.getElementById('add-right');
      const options = document.getElementById('add-options');

      leftEl.innerHTML = '';
      rightEl.innerHTML = '';
      options.innerHTML = '';

      const a = Math.floor(Math.random() * 5) + 1;
      const b = Math.floor(Math.random() * 5) + 1;
      currentAnswer = a + b;

      const icon = monsterItems[Math.floor(Math.random() * monsterItems.length)];
      leftEl.innerText = icon.repeat(a);
      rightEl.innerText = icon.repeat(b);

      setInstruction(`Lili, spočítej všechny věci dohromady: ${a} + ${b}`);

      let choices = [currentAnswer];
      while (choices.length < 3) {
        let rnd = Math.floor(Math.random() * 10) + 1;
        if (!choices.includes(rnd)) choices.push(rnd);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = num;
        btn.onclick = () => {
          if (num === currentAnswer) {
            updateScore(1);
            triggerCatCelebration();
            setTimeout(initMode4, 2300);
          } else {
            playErrorSound();
            speak("Zkus to sečíst znovu, Lili!");
          }
        };
        options.appendChild(btn);
      });
    }

    // --- MODE 5: Spojovačka ---
    let dots = [];
    let nextDotIndex = 0;

    function initMode5() {
      setInstruction("Lili, spoj tečky podle čísel od 1 do 5!");
      const canvas = document.getElementById('connect-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      nextDotIndex = 0;
      dots = [
        { x: 250, y: 50, num: 1 },
        { x: 400, y: 150, num: 2 },
        { x: 320, y: 300, num: 3 },
        { x: 180, y: 300, num: 4 },
        { x: 100, y: 150, num: 5 }
      ];

      drawCanvas();

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

        const targetDot = dots[nextDotIndex];
        const dist = Math.hypot(clickX - targetDot.x, clickY - targetDot.y);

        if (dist < 35) {
          playTone(300 + (nextDotIndex * 90), 'sine', 0.15);
          speak(targetDot.num.toString());
          nextDotIndex++;

          if (nextDotIndex === dots.length) {
            updateScore(2);
            triggerCatCelebration();
            drawFinalShape();
          } else {
            drawCanvas();
          }
        }
      };
    }

    function drawCanvas() {
      const canvas = document.getElementById('connect-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (nextDotIndex > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#ff007f';
        ctx.lineWidth = 6;
        ctx.moveTo(dots[0].x, dots[0].y);
        for (let i = 1; i < nextDotIndex; i++) {
          ctx.lineTo(dots[i].x, dots[i].y);
        }
        ctx.stroke();
      }

      dots.forEach((dot, idx) => {
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = idx < nextDotIndex ? '#ff007f' : (idx === nextDotIndex ? '#00f5d4' : '#8a2be2');
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Fredoka One';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(dot.num, dot.x, dot.y);
      });
    }

    function drawFinalShape() {
      const canvas = document.getElementById('connect-canvas');
      const ctx = canvas.getContext('2d');
      
      ctx.beginPath();
      ctx.strokeStyle = '#ff007f';
      ctx.lineWidth = 6;
      ctx.moveTo(dots[0].x, dots[0].y);
      for (let i = 1; i < dots.length; i++) {
        ctx.lineTo(dots[i].x, dots[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 0, 127, 0.45)';
      ctx.fill();
      ctx.stroke();

      ctx.font = '80px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎀', 250, 185);

      setTimeout(initMode5, 3000);
    }

    // --- MODE 6: Poslechni a Najdi ---
    function initMode6() {
      const container = document.getElementById('listen-options');
      container.innerHTML = '';

      const targetNum = Math.floor(Math.random() * 10) + 1;
      currentAnswer = targetNum;

      setInstruction(`Lili, najdi číslo ${targetNum}!`);

      let choices = [targetNum];
      while (choices.length < 5) {
        let rnd = Math.floor(Math.random() * 10) + 1;
        if (!choices.includes(rnd)) choices.push(rnd);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.style.width = '85px';
        btn.style.height = '85px';
        btn.style.fontSize = '40px';
        btn.innerText = num;
        btn.onclick = () => {
          if (num === currentAnswer) {
            updateScore(1);
            triggerCatCelebration();
            setTimeout(initMode6, 2300);
          } else {
            playErrorSound();
            speak(`To je číslo ${num}. Lili, hledej číslo ${targetNum}!`);
          }
        };
        container.appendChild(btn);
      });
    }

    // --- MODE 7: Pexeso Čísla ---
    let flippedCards = [];
    let matchedPairs = 0;

    function initMode7() {
      setInstruction("Lili, najdi stejné dvojice! Číslo a počet obrázků.");
      const board = document.getElementById('memory-board');
      board.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;

      const pairs = [1, 2, 3, 4];
      let cardsData = [];

      pairs.forEach(num => {
        cardsData.push({ val: num, type: 'num', display: num });
        cardsData.push({ val: num, type: 'icon', display: '🎀'.repeat(num) });
      });

      cardsData.sort(() => Math.random() - 0.5);

      cardsData.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = 'memory-card';
        card.dataset.val = data.val;
        card.dataset.index = index;

        card.onclick = () => {
          if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;

          playTone(450, 'sine', 0.1);
          card.innerText = data.display;
          card.classList.add('flipped');
          flippedCards.push({ card, data });

          if (flippedCards.length === 2) {
            const [c1, c2] = flippedCards;
            if (c1.data.val === c2.data.val) {
              c1.card.classList.add('matched');
              c2.card.classList.add('matched');
              flippedCards = [];
              matchedPairs++;
              playTone(700, 'sine', 0.2);

              if (matchedPairs === pairs.length) {
                updateScore(3);
                triggerCatCelebration();
                setTimeout(initMode7, 3000);
              }
            } else {
              setTimeout(() => {
                playErrorSound();
                c1.card.innerText = '';
                c2.card.innerText = '';
                c1.card.classList.remove('flipped');
                c2.card.classList.remove('flipped');
                flippedCards = [];
              }, 1000);
            }
          }
        };

        board.appendChild(card);
      });
    }

    // --- MODE 8: Obchůdek s přizpůsobenými oblečky ---
    function initMode8() {
      setInstruction("Vítá tě kočičí obchůdek! Utrať své trofeje a obleč kočičku Crescent do parádních kostýmů!");
      const container = document.getElementById('shop-items-container');
      container.innerHTML = '';

      shopItems.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'shop-item';

        const isEquipped = index === equippedIndex;

        itemEl.innerHTML = `
          <div class="preview-box">${getCatSvgMarkup(item.svg)}</div>
          <div class="name">${item.name}</div>
          <div class="price">${item.bought ? 'Koupeno' : item.price + ' 🏆'}</div>
          <button class="buy-btn ${isEquipped ? 'equipped' : ''}" id="btn-shop-${item.id}">
            ${isEquipped ? 'Nasazeno' : (item.bought ? 'Nasadit' : 'Koupit')}
          </button>
        `;

        const btn = itemEl.querySelector(`#btn-shop-${item.id}`);
        
        if (!item.bought && score < item.price) {
          btn.disabled = true;
        }

        btn.onclick = () => {
          if (!item.bought) {
            if (score >= item.price) {
              score -= item.price;
              item.bought = true;
              updateScore(0);
              playWinSound();
              speak(`Lili, koupila jsi ${item.name}!`);
            }
          }
          equippedIndex = index;
          updateCatAvatarDisplay();
          initMode8();
        };

        container.appendChild(itemEl);
      });
    }

    // Fullscreen
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.onload = () => {
      updateCatAvatarDisplay();
      initMode1();
    };
  </script>
</body>
</html>
