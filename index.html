<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster High – Čísla a počítání!</title>
  <style>
    :root {
      --pink: #ff1493;
      --dark-pink: #d10069;
      --purple: #8a2be2;
      --black: #111111;
      --light-purple: #f3e8ff;
      --turquoise: #00f5d4;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      background-color: var(--black);
      background-image: 
        radial-gradient(circle, #2b003b 10%, transparent 11%),
        radial-gradient(circle, #1a001e 10%, transparent 11%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header & Fullscreen */
    header {
      width: 100%;
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--purple));
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5);
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bow {
      color: var(--pink);
      font-size: 28px;
      filter: drop-shadow(0 0 5px #fff);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      text-shadow: 2px 2px 4px #000;
      letter-spacing: 1px;
    }

    .fs-btn {
      background: var(--black);
      color: var(--pink);
      border: 2px solid var(--pink);
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
      transition: all 0.2s;
    }

    .fs-btn:hover {
      transform: scale(1.05);
      background: var(--pink);
      color: #fff;
    }

    /* Game Navigation & Score */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95%;
      max-width: 800px;
      margin: 15px 0;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    .mode-btn {
      background: #222;
      border: 2px solid var(--purple);
      color: #fff;
      padding: 8px 14px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--pink);
      border-color: #fff;
      box-shadow: 0 0 12px var(--pink);
      transform: scale(1.05);
    }

    .score-board {
      background: rgba(138, 43, 226, 0.3);
      border: 2px solid var(--pink);
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Main Container */
    .game-card {
      background: rgba(20, 10, 30, 0.9);
      border: 4px solid var(--pink);
      border-radius: 25px;
      width: 95%;
      max-width: 800px;
      min-height: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 25px rgba(239, 10, 147, 0.4);
      position: relative;
      margin-bottom: 20px;
    }

    .instruction-box {
      background: linear-gradient(135deg, var(--purple), var(--dark-pink));
      padding: 12px 25px;
      border-radius: 20px;
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .instruction-box:hover {
      transform: scale(1.02);
    }

    /* Mode 1: Counting */
    .items-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 180px;
      max-width: 600px;
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 15px;
    }

    .monster-item {
      font-size: 45px;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
      animation: float 3s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .monster-item:hover {
      transform: scale(1.2) rotate(10deg);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .options-grid {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .num-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--purple), #4a0e4e);
      border: 3px solid var(--pink);
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .num-btn:hover {
      transform: scale(1.15) rotate(-5deg);
      background: var(--pink);
      box-shadow: 0 0 20px var(--pink);
    }

    /* Mode 2: Show Number */
    .big-target {
      font-size: 110px;
      font-weight: bold;
      color: var(--turquoise);
      text-shadow: 0 0 20px var(--turquoise), 3px 3px 0px #000;
      margin: 10px 0;
      font-family: 'Arial Black', sans-serif;
    }

    .cards-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card-choice {
      width: 120px;
      height: 120px;
      background: #2a103c;
      border: 3px solid var(--purple);
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card-choice:hover {
      border-color: var(--pink);
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(255, 20, 147, 0.6);
    }

    .card-choice .icons {
      font-size: 24px;
      word-break: break-all;
      text-align: center;
      line-height: 1.2;
    }

    /* Mode 3: Connect Dots Canvas */
    .canvas-container {
      position: relative;
      width: 500px;
      height: 350px;
      background: rgba(0,0,0,0.6);
      border: 2px dashed var(--pink);
      border-radius: 15px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 15px;
    }

    /* Character Companion */
    .character-box {
      position: absolute;
      bottom: -10px;
      right: 10px;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
    }

    .avatar {
      font-size: 60px;
      filter: drop-shadow(0 0 10px var(--pink));
    }

    /* Feedback Overlay */
    .feedback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px;
      pointer-events: none;
      transition: transform 0.3s ease-out;
      z-index: 100;
    }

    .feedback.show {
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 18px; }
      .instruction-box { font-size: 17px; }
      .num-btn { width: 55px; height: 55px; font-size: 24px; }
      .canvas-container { width: 320px; height: 280px; }
      .card-choice { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <span class="bow">🎀</span>
      <h1>Monster High: Čísla</h1>
    </div>
    <button class="fs-btn" onclick="toggleFullScreen()">Fullscreen ⛶</button>
  </header>

  <div class="top-bar">
    <div class="nav-btns">
      <button class="mode-btn active" onclick="switchMode(1)">Spočítej</button>
      <button class="mode-btn" onclick="switchMode(2)">Najdi Číslo</button>
      <button class="mode-btn" onclick="switchMode(3)">Spojovačka</button>
    </div>
    <div class="score-board">
      <span>Trofeje:</span>
      <span id="score-count" style="color: var(--pink); font-weight: bold;">0</span>
      <span>🏆</span>
    </div>
  </div>

  <div class="game-card">
    <div class="instruction-box" id="instruction" onclick="repeatInstruction()">
      <span id="speaker-icon">🔊</span>
      <span id="instruction-text">Načítám hru...</span>
    </div>

    <!-- Mode 1: Spočítej předměty -->
    <div id="mode-1" class="game-mode-container" style="display: flex; flex-direction: column; align-items: center; width:100%;">
      <div class="items-grid" id="items-container"></div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- Mode 2: Najdi správné číslo / kartičku -->
    <div id="mode-2" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="big-target" id="target-number">5</div>
      <div class="cards-grid" id="cards-container"></div>
    </div>

    <!-- Mode 3: Spojovačka -->
    <div id="mode-3" class="game-mode-container" style="display: none; flex-direction: column; align-items: center; width:100%;">
      <div class="canvas-container">
        <canvas id="connect-canvas" width="500" height="350"></canvas>
      </div>
    </div>

    <div class="character-box">
      <div class="avatar" id="avatar-emoji">🧛‍♀️</div>
    </div>

    <div class="feedback" id="feedback-emoji">💖</div>
  </div>

  <script>
    // Audio Synth for FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWinSound() {
      playTone(523.25, 'triangle', 0.1);
      setTimeout(() => playTone(659.25, 'triangle', 0.1), 100);
      setTimeout(() => playTone(783.99, 'triangle', 0.15), 200);
      setTimeout(() => playTone(1046.50, 'triangle', 0.3), 300);
    }

    function playErrorSound() {
      playTone(200, 'sawtooth', 0.2);
      setTimeout(() => playTone(150, 'sawtooth', 0.25), 150);
    }

    // Voice synthesis (Czech)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'cs-CZ';
        msg.rate = 0.9;
        msg.pitch = 1.2; 
        window.speechSynthesis.speak(msg);
      }
    }

    // Game Variables
    let currentMode = 1;
    let score = 0;
    let currentAnswer = 0;
    let lastText = "";

    const monsterItems = ['🦇', '🎀', '🧪', '🕷️', '💄', '🔮', '⚡', '👑', '💀'];
    const avatars = ['🧛‍♀️', '🐺', '⚡', 'Cleo'];

    // Web Speech Warmup
    document.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });

    function setInstruction(text) {
      lastText = text;
      document.getElementById('instruction-text').innerText = text;
      speak(text);
    }

    function repeatInstruction() {
      if (lastText) speak(lastText);
    }

    function updateScore(points) {
      score += points;
      if (score < 0) score = 0;
      document.getElementById('score-count').innerText = score;
    }

    function showFeedback(isCorrect) {
      const fb = document.getElementById('feedback-emoji');
      fb.innerText = isCorrect ? '💖' : '❌';
      fb.classList.add('show');
      if (isCorrect) {
        playWinSound();
      } else {
        playErrorSound();
      }
      setTimeout(() => fb.classList.remove('show'), 800);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
      });

      document.getElementById('mode-1').style.display = mode === 1 ? 'flex' : 'none';
      document.getElementById('mode-2').style.display = mode === 2 ? 'flex' : 'none';
      document.getElementById('mode-3').style.display = mode === 3 ? 'flex' : 'none';

      if (mode === 1) initMode1();
      if (mode === 2) initMode2();
      if (mode === 3) initMode3();
    }

    // --- MODE 1: Spočítej věci ---
    function initMode1() {
      const container = document.getElementById('items-container');
      const options = document.getElementById('options-container');
      container.innerHTML = '';
      options.innerHTML = '';

      const count = Math.floor(Math.random() * 10) + 1; // 1 - 10
      currentAnswer = count;
      const itemIcon = monsterItems[Math.floor(Math.random() * monsterItems.length)];

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'monster-item';
        el.innerText = itemIcon;
        el.style.animationDelay = (i * 0.1) + 's';
        el.onclick = () => playTone(400 + (i * 50), 'sine', 0.1);
        container.appendChild(el);
      }

      setInstruction(`Spočítej ikonky a klikni na správné číslo!`);

      // Generate 3 choices
      let choices = [count];
      while (choices.length < 3) {
        let rnd = Math.floor(Math.random() * 10) + 1;
        if (!choices.includes(rnd)) choices.push(rnd);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = num;
        btn.onclick = () => checkMode1(num);
        options.appendChild(btn);
      });
    }

    function checkMode1(selected) {
      if (selected === currentAnswer) {
        showFeedback(true);
        updateScore(1);
        speak("Skvělé! To je správně!");
        setTimeout(initMode1, 1200);
      } else {
        showFeedback(false);
        speak("Zkus to znovu, spočítej to ještě jednou.");
      }
    }

    // --- MODE 2: Najdi číslo ---
    function initMode2() {
      const targetEl = document.getElementById('target-number');
      const cardsContainer = document.getElementById('cards-container');
      cardsContainer.innerHTML = '';

      const targetNum = Math.floor(Math.random() * 10) + 1;
      currentAnswer = targetNum;
      targetEl.innerText = targetNum;

      setInstruction(`Která kartička má ${targetNum} věcí?`);

      const itemIcon = monsterItems[Math.floor(Math.random() * monsterItems.length)];

      // Make 3 card choices
      let choices = [targetNum];
      while (choices.length < 3) {
        let rnd = Math.floor(Math.random() * 10) + 1;
        if (!choices.includes(rnd)) choices.push(rnd);
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(count => {
        const card = document.createElement('div');
        card.className = 'card-choice';
        
        const iconsDiv = document.createElement('div');
        iconsDiv.className = 'icons';
        iconsDiv.innerText = itemIcon.repeat(count);
        
        card.appendChild(iconsDiv);
        card.onclick = () => checkMode2(count);
        cardsContainer.appendChild(card);
      });
    }

    function checkMode2(selected) {
      if (selected === currentAnswer) {
        showFeedback(true);
        updateScore(1);
        speak("Úžasné! Našla jsi správnou kartičku!");
        setTimeout(initMode2, 1200);
      } else {
        showFeedback(false);
        speak("Ajej, tady je jiný počet. Hledej dál!");
      }
    }

    // --- MODE 3: Spojovačka (Connect Dots 1 to 5 or 10) ---
    let dots = [];
    let nextDotIndex = 0;

    function initMode3() {
      setInstruction("Spoj tečky podle čísel od 1 do 5!");
      const canvas = document.getElementById('connect-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      nextDotIndex = 0;
      dots = [
        { x: 250, y: 50, num: 1 },
        { x: 400, y: 150, num: 2 },
        { x: 320, y: 300, num: 3 },
        { x: 180, y: 300, num: 4 },
        { x: 100, y: 150, num: 5 }
      ];

      drawCanvas();

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

        const targetDot = dots[nextDotIndex];
        const dist = Math.hypot(clickX - targetDot.x, clickY - targetDot.y);

        if (dist < 30) {
          // Hit correct dot
          playTone(300 + (nextDotIndex * 100), 'sine', 0.15);
          speak(targetDot.num.toString());
          nextDotIndex++;

          if (nextDotIndex === dots.length) {
            showFeedback(true);
            updateScore(2);
            setTimeout(() => {
              speak("Nádherné! Spojila jsi celou mašli Monster High!");
              drawFinalShape();
            }, 300);
          } else {
            drawCanvas();
          }
        }
      };
    }

    function drawCanvas() {
      const canvas = document.getElementById('connect-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw connected lines
      if (nextDotIndex > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#ff1493';
        ctx.lineWidth = 5;
        ctx.moveTo(dots[0].x, dots[0].y);
        for (let i = 1; i < nextDotIndex; i++) {
          ctx.lineTo(dots[i].x, dots[i].y);
        }
        ctx.stroke();
      }

      // Draw Dots
      dots.forEach((dot, idx) => {
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = idx < nextDotIndex ? '#ff1493' : (idx === nextDotIndex ? '#00f5d4' : '#8a2be2');
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(dot.num, dot.x, dot.y);
      });
    }

    function drawFinalShape() {
      const canvas = document.getElementById('connect-canvas');
      const ctx = canvas.getContext('2d');
      
      // Close path
      ctx.beginPath();
      ctx.strokeStyle = '#ff1493';
      ctx.lineWidth = 6;
      ctx.moveTo(dots[0].x, dots[0].y);
      for (let i = 1; i < dots.length; i++) {
        ctx.lineTo(dots[i].x, dots[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 20, 147, 0.4)';
      ctx.fill();
      ctx.stroke();

      // Big Ribbon emoji in middle
      ctx.font = '70px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎀', 250, 180);

      setTimeout(initMode3, 3000);
    }

    // Fullscreen Toggle
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Chyba při přechodu na celou obrazovku: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Start initial game
    window.onload = () => {
      initMode1();
    };
  </script>
</body>
</html>
